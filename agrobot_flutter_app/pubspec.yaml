name: agrobot_flutter_app
description: "A new Flutter project with Farmer and Admin roles, camera/OpenCV image capture for crop disease detection, and smart farming features."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.6
  path: ^1.9.0
  http: ^1.6.0
  image_picker: ^1.2.4
  camera: ^0.12.1
  permission_handler: 12.0.1
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  record: ^7.1.2
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 24
